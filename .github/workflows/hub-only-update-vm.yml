name: Hub-only update and rollback on disposable Ubuntu VM

# This root fixture is never run for fork PRs. It seeds an independent Agent
# and inert SSH transport units, then installs and updates only the local Hub.
on:
  push:
    branches: [main]
    paths:
      - 'run.sh'
      - 'deploy/hub_only_update.py'
      - 'deploy/remote_update_worker.py'
      - 'deploy/release_feed.py'
      - 'deploy/sovagrid-release-feed.service'
      - 'deploy/sovagrid-release-feed.timer'
      - 'deploy/hub_only_auto_update.py'
      - 'deploy/sovagrid-hub-only-update.service'
      - 'deploy/sovagrid-hub-only-update.timer'
      - 'deploy/promote_agent_only.py'
      - 'tests/hub_only_candidate.py'
      - 'tests/hub_only_update_vm.py'
      - 'tests/release_feed_vm.py'
      - '.github/workflows/hub-only-update-vm.yml'
  workflow_dispatch:
    inputs:
      external_agent_apply:
        description: Run the destructive external Agent apply trial on this disposable VM
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: hub-only-update-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Confirm a fresh disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(cat /proc/1/comm)" = systemd
          sudo -n install -d -o root -g root -m 0755 /opt
          test "$(stat -c '%u:%a' /opt)" = 0:755
          sudo -n systemctl start docker
          sudo -n docker info >/dev/null
          sudo -n docker compose version
          test ! -e /opt/sovagrid-src
          test ! -e /etc/sovagrid
      - name: Verify published server-v0.11.0 baseline bundle and build candidate
        env:
          RELEASE_URL: https://github.com/sovagrid/sovagrid-blueprint/releases/download/server-v0.11.0/SovaGrid-server-source.tar.gz
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
            "$RELEASE_URL" -o "$RUNNER_TEMP/sovagrid-0.11.0-published.tar.gz"
          printf '%s  %s\n' \
            '10abb18ca39d789d3a9cc8bd04d36126f6dd624a81e48219bd814fb6a15ab766' \
            "$RUNNER_TEMP/sovagrid-0.11.0-published.tar.gz" | sha256sum --check -
          python3 tests/hub_only_candidate.py \
            "$RUNNER_TEMP/sovagrid-0.11.0-published.tar.gz" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sovagrid-candidate-workspace" \
            "$RUNNER_TEMP/sovagrid-candidate.tar.gz"
          mkdir "$RUNNER_TEMP/sovagrid-published-source"
          tar -xzf "$RUNNER_TEMP/sovagrid-0.11.0-published.tar.gz" \
            -C "$RUNNER_TEMP/sovagrid-published-source" --no-same-owner
      - name: Build an opt-in candidate from one reviewed server component set
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_agent_apply }}
        env:
          OLD_AGENT_COMMIT: 1085a14a7c0c654a5a6ec16edd028dea1c543c8e
          AGENT_COMMIT: 7b4dab289ca239266b77584a927f6976f375042c
          HUB_COMMIT: ae8b2fc6075aa76b418ad202887515b78e9e63d1
          WEB_COMMIT: eb53324c7f2ef6186ad445fb729b6687acf65595
          VPN_COMMIT: e500d5a9a97ad329c33af6a06eb1d2f17a541897
        run: |
          set -o pipefail
          [[ "$OLD_AGENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git -C "$RUNNER_TEMP/sovagrid-candidate-workspace/sovagrid-agent" \
            fetch --no-tags origin "$OLD_AGENT_COMMIT"
          mkdir "$RUNNER_TEMP/sovagrid-old-agent-source"
          git -C "$RUNNER_TEMP/sovagrid-candidate-workspace/sovagrid-agent" \
            archive "$OLD_AGENT_COMMIT" | \
            tar -x -C "$RUNNER_TEMP/sovagrid-old-agent-source"
          while read -r repo commit; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            git -C "$RUNNER_TEMP/sovagrid-candidate-workspace/$repo" \
              fetch --no-tags origin "$commit"
            git -C "$RUNNER_TEMP/sovagrid-candidate-workspace/$repo" \
              checkout --quiet --detach "$commit"
            test "$(git -C "$RUNNER_TEMP/sovagrid-candidate-workspace/$repo" rev-parse HEAD)" = "$commit"
          done <<REFS
          sovagrid-agent $AGENT_COMMIT
          sovagrid-hub $HUB_COMMIT
          sovagrid-web $WEB_COMMIT
          sovagrid-vpn $VPN_COMMIT
          REFS
          python3 "$RUNNER_TEMP/sovagrid-candidate-workspace/sovagrid-blueprint/package_server.py" \
            "$RUNNER_TEMP/sovagrid-external-agent-candidate.tar.gz"
          mv "$RUNNER_TEMP/sovagrid-external-agent-candidate.tar.gz" \
            "$RUNNER_TEMP/sovagrid-candidate.tar.gz"
          mkdir "$RUNNER_TEMP/sovagrid-candidate-source"
          tar -xzf "$RUNNER_TEMP/sovagrid-candidate.tar.gz" \
            -C "$RUNNER_TEMP/sovagrid-candidate-source" --no-same-owner
      - name: Seed and pin an independent external Agent and two transport units
        env:
          EXTERNAL_AGENT_APPLY: ${{ inputs.external_agent_apply || false }}
        run: |
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/promotion_vm.py seed "$RUNNER_TEMP/sovagrid-published-source"
          if [ "$EXTERNAL_AGENT_APPLY" = true ]; then
            sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_EXTERNAL_APPLY_VM_FIXTURE=1 \
              python3 tests/integrated_external_agent_apply_vm.py seed \
              "$RUNNER_TEMP/sovagrid-candidate-source" \
              "$RUNNER_TEMP/sovagrid-old-agent-source"
          fi
          old_manifest=$(sha256sum "$RUNNER_TEMP/sovagrid-published-source/sovagrid-bundle.json" | cut -d ' ' -f1)
          sudo python3 "$RUNNER_TEMP/sovagrid-published-source/sovagrid-blueprint/deploy/promote_agent_only.py" \
            prepare --manifest-sha256 "$old_manifest"
          sudo install -d -o root -g root -m 0755 /opt/sovagrid-src
          sudo tar -xzf "$RUNNER_TEMP/sovagrid-0.11.0-published.tar.gz" \
            -C /opt/sovagrid-src --no-same-owner
          sudo /opt/sovagrid-src/sovagrid-blueprint/run.sh --hub-only
          sudo python3 /opt/sovagrid-src/sovagrid-blueprint/deploy/promote_agent_only.py \
            activate --enable-commands
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/hub_only_update_vm.py initial
          test ! -e /etc/systemd/system/sovagrid-auto-update.timer
      - name: Stage and preflight the exact candidate
        run: |
          candidate_sha=$(sha256sum "$RUNNER_TEMP/sovagrid-candidate.tar.gz" | cut -d ' ' -f1)
          old_manifest=$(sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)
          sudo install -d -o root -g root -m 0700 /opt/sovagrid-candidates
          sudo install -d -o root -g root -m 0700 "/opt/sovagrid-candidates/$candidate_sha"
          sudo install -d -o root -g root -m 0755 "/opt/sovagrid-candidates/$candidate_sha/source"
          sudo install -o root -g root -m 0600 "$RUNNER_TEMP/sovagrid-candidate.tar.gz" \
            "/opt/sovagrid-candidates/$candidate_sha/bundle.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/sovagrid-candidate.tar.gz" \
            -C "/opt/sovagrid-candidates/$candidate_sha/source" --no-same-owner
          printf '%s\n' "$candidate_sha" | sudo tee "/opt/sovagrid-candidates/$candidate_sha/.ready" >/dev/null
          sudo chmod 0600 "/opt/sovagrid-candidates/$candidate_sha/.ready"
          sudo python3 -IB - "/opt/sovagrid-candidates/$candidate_sha/source/sovagrid-blueprint/deploy/hub_only_update.py" \
            "$candidate_sha" <<'PY'
          import importlib.util
          import sys
          spec = importlib.util.spec_from_file_location('sovagrid_vm_update', sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest, _state, commits, _baseline = module.inspect()
          print('VM inspected current manifest:', manifest)
          module._candidate(sys.argv[2], commits)
          print('VM verified exact staged candidate')
          PY
          sudo python3 -I "/opt/sovagrid-candidates/$candidate_sha/source/sovagrid-blueprint/deploy/hub_only_update.py" \
            preflight "$candidate_sha" "$old_manifest"
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_RELEASE_FEED_VM_FIXTURE=1 \
            python3 tests/release_feed_vm.py legacy-guard \
            "/opt/sovagrid-candidates/$candidate_sha/source/sovagrid-blueprint/run.sh" refused
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/promotion_vm.py external
      - name: Update local Hub and second Agent, retaining enabled commands
        run: |
          candidate_sha=$(sha256sum "$RUNNER_TEMP/sovagrid-candidate.tar.gz" | cut -d ' ' -f1)
          old_manifest=$(sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)
          sudo python3 -I "/opt/sovagrid-candidates/$candidate_sha/source/sovagrid-blueprint/deploy/hub_only_update.py" \
            apply "$candidate_sha" "$old_manifest"
          new_manifest=$(sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)
          test "$new_manifest" != "$old_manifest"
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/hub_only_update_vm.py verify "$new_manifest"
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/hub_only_update_vm.py timer-inactive
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_RELEASE_FEED_VM_FIXTURE=1 \
            python3 tests/release_feed_vm.py installed
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_RELEASE_FEED_VM_FIXTURE=1 \
            python3 tests/release_feed_vm.py legacy-guard \
            /opt/sovagrid-src/sovagrid-blueprint/run.sh refused
          test ! -e /etc/systemd/system/sovagrid-auto-update.timer
      - name: Repeat the Hub-only installer without changing inactive feed state
        run: |
          sudo /opt/sovagrid-src/sovagrid-blueprint/run.sh --hub-only
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_RELEASE_FEED_VM_FIXTURE=1 \
            python3 tests/release_feed_vm.py installed
          current_manifest=$(sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/hub_only_update_vm.py verify "$current_manifest"
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          state = Path('/var/lib/sovagrid/release-feed-state.json')
          state.write_text(json.dumps({'format': 1, 'highest_sequence': 3,
                                       'highest_version': '0.11.1', 'highest_issued_at': 1,
                                       'last_seen_at': 1}, sort_keys=True) + '\n')
          state.chmod(0o600)
          PY
          sudo sha256sum /etc/systemd/system/sovagrid-release-feed.service \
            /etc/systemd/system/sovagrid-release-feed.timer \
            /var/lib/sovagrid/.release-feed-units-managed-by-run-sh \
            /var/lib/sovagrid/release-feed-state.json > "$RUNNER_TEMP/release-feed-before-failure.sha256"
      - name: Build a valid candidate that fails after Hub installation
        run: |
          cp -a "$RUNNER_TEMP/sovagrid-candidate-workspace" "$RUNNER_TEMP/sovagrid-failure-workspace"
          python3 - "$RUNNER_TEMP/sovagrid-failure-workspace/sovagrid-blueprint/run.sh" \
            "$RUNNER_TEMP/sovagrid-failure-workspace/sovagrid-blueprint/deploy/sovagrid-release-feed.service" <<'PY'
          from pathlib import Path
          import sys
          file = Path(sys.argv[1])
          source = file.read_text()
          needle = "  say 'Agent was skipped by --hub-only. Re-run without it to enroll the host.'"
          assert source.count(needle) == 1
          file.write_text(source.replace(needle,
              "  printf 'corrupted during rollback fixture\\n' > /var/lib/sovagrid/release-feed-state.json\n"
              "  chmod 0600 /var/lib/sovagrid/release-feed-state.json\n"
              "  die 'intentional VM rollback fixture'\n" + needle))
          service = Path(sys.argv[2])
          value = service.read_text()
          original = 'Description=Stage one cryptographically signed SovaGrid server release'
          assert value.count(original) == 1
          service.write_text(value.replace(original, 'Description=Rollback fixture release feed service'))
          PY
          git -C "$RUNNER_TEMP/sovagrid-failure-workspace/sovagrid-blueprint" add \
            run.sh deploy/sovagrid-release-feed.service
          git -C "$RUNNER_TEMP/sovagrid-failure-workspace/sovagrid-blueprint" \
            -c user.name='SovaGrid VM Fixture' -c user.email='vm-fixture@example.invalid' \
            commit -m 'VM rollback fixture: fail after Hub setup'
          python3 "$RUNNER_TEMP/sovagrid-failure-workspace/sovagrid-blueprint/package_server.py" \
            "$RUNNER_TEMP/sovagrid-failure-candidate.tar.gz"
          candidate_sha=$(sha256sum "$RUNNER_TEMP/sovagrid-failure-candidate.tar.gz" | cut -d ' ' -f1)
          sudo install -d -o root -g root -m 0700 "/opt/sovagrid-candidates/$candidate_sha"
          sudo install -d -o root -g root -m 0755 "/opt/sovagrid-candidates/$candidate_sha/source"
          sudo install -o root -g root -m 0600 "$RUNNER_TEMP/sovagrid-failure-candidate.tar.gz" \
            "/opt/sovagrid-candidates/$candidate_sha/bundle.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/sovagrid-failure-candidate.tar.gz" \
            -C "/opt/sovagrid-candidates/$candidate_sha/source" --no-same-owner
          printf '%s\n' "$candidate_sha" | sudo tee "/opt/sovagrid-candidates/$candidate_sha/.ready" >/dev/null
          sudo chmod 0600 "/opt/sovagrid-candidates/$candidate_sha/.ready"
      - name: Arm one candidate and prove timer rollback and invariants
        run: |
          candidate_sha=$(sha256sum "$RUNNER_TEMP/sovagrid-failure-candidate.tar.gz" | cut -d ' ' -f1)
          current_manifest=$(sha256sum /opt/sovagrid-src/sovagrid-bundle.json | cut -d ' ' -f1)
          sudo python3 -I /opt/sovagrid-src/sovagrid-blueprint/deploy/hub_only_auto_update.py \
            arm "$candidate_sha" "$current_manifest"
          sudo systemctl is-active --quiet sovagrid-hub-only-update.timer
          sudo python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('/var/lib/sovagrid/hub/hub.sqlite') as db:
              db.execute('DELETE FROM sessions')
          PY
          set +e
          result=$(sudo python3 -I /opt/sovagrid-src/sovagrid-blueprint/deploy/hub_only_auto_update.py run 2>&1)
          code=$?
          set -e
          printf '%s\n' "$result"
          test "$code" = 40
          printf '%s\n' "$result" | grep -Fq 'SG_HUB_ONLY_STAGE:ROLLED_BACK'
          printf '%s\n' "$result" | grep -Fq 'SG_HUB_ONLY_AUTO_UPDATE_REFUSE:UPDATE_FAILED'
          test ! -e /etc/sovagrid-hub/hub-only-auto-update.json
          sudo python3 -I /opt/sovagrid-src/sovagrid-blueprint/deploy/hub_only_auto_update.py status | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["last"]["state"] == "needs_attention"'
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_PROMOTION_VM_FIXTURE=1 \
            python3 tests/hub_only_update_vm.py verify "$current_manifest"
          sudo sha256sum --check "$RUNNER_TEMP/release-feed-before-failure.sha256"
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_RELEASE_FEED_VM_FIXTURE=1 \
            python3 tests/release_feed_vm.py installed
          test ! -e /etc/systemd/system/sovagrid-auto-update.timer
      - name: Exercise external Agent apply and boot recovery on the disposable VM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_agent_apply }}
        run: |
          candidate_sha=$(sha256sum "$RUNNER_TEMP/sovagrid-candidate.tar.gz" | cut -d ' ' -f1)
          sudo GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted SOVAGRID_EXTERNAL_APPLY_VM_FIXTURE=1 \
            python3 tests/integrated_external_agent_apply_vm.py run "$candidate_sha"
