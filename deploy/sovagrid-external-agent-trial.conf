[Service]
# Installed only by a future lease-guarded external Agent writer. The root
# pre-start check is immediately before ExecStart, after boot recovery.
# The candidate Agent checks the live root supervisor itself before opening
# any Hub connection and exits on gate loss. The old Agent ignores this env
# setting if an interrupted trial is rolled back on boot.
Environment=SOVAGRID_EXTERNAL_TRIAL_GATE=1
# A future root writer creates this private file for the exact trial epoch.
# The old Agent ignores it after rollback; the new Agent refuses a missing
# epoch before opening any connection to Hub.
EnvironmentFile=-/run/sovagrid-external-agent-trial/epoch.env
ExecStartPre=+/usr/bin/python3 -I /opt/sovagrid-src/sovagrid-blueprint/deploy/external_agent_update.py trial-start-guard
