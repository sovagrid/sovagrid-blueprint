name: sovagrid

services:
  hub:
    build:
      context: ../../sovagrid-hub
      args:
        SOVAGRID_BUNDLE_MANIFEST_SHA256: ${SOVAGRID_BUNDLE_MANIFEST_SHA256:-}
    image: sovagrid-hub:local
    command: ["--db", "/data/hub.sqlite", "serve", "--bind", "0.0.0.0", "--port", "8765", "--trusted-proxy", "172.30.253.10", "--telegram-token-file", "/data/telegram-bot-token"]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    volumes:
      - type: bind
        source: ${SOVAGRID_HUB_DATA_DIR:?Set SOVAGRID_HUB_DATA_DIR to an absolute path on the Docker host}
        target: /data
      - type: bind
        source: /var/lib/sovagrid/vpn
        target: /vpn
        read_only: true
    networks: [private]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../../sovagrid-web
    image: sovagrid-web:local
    user: "10002:10002"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /tmp/config
    volumes:
      - type: bind
        source: ${SOVAGRID_CADDY_DATA_DIR:?Set SOVAGRID_CADDY_DATA_DIR to an absolute path on the Docker host}
        target: /data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=10002,gid=10002,mode=0700
    ports:
      - "127.0.0.1:8766:8080"
      - "127.0.0.1:8767:8443"
    networks:
      private:
        ipv4_address: 172.30.253.10
    depends_on:
      hub:
        condition: service_healthy

  ssh-gateway:
    build:
      context: ../../sovagrid-web
      dockerfile: Dockerfile.ssh-gateway
    image: sovagrid-ssh-gateway:local
    user: "10003:10003"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    environment:
      SOVAGRID_HOST_SSH_PORT: ${SOVAGRID_HOST_SSH_PORT:-22}
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8768/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    depends_on:
      hub:
        condition: service_healthy

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.253.0/28
          gateway: 172.30.253.1
